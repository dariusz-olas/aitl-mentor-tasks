name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ci-only-aitl-secret-min-16-chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: verify env hook
        run: node scripts/verify-hook.js
      - name: npm audit (prod high+)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (critical, incl. dev)
        run: npm audit --audit-level=critical
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
